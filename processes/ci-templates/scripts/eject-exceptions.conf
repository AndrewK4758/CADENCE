# Non-CLAIRE exceptions -- the deny-by-default eject boundary (PI-017 DEC-011).
#
# claire-eject.sh treats a framework-dev repo as CLAIRE BY DEFAULT: the
# footprint derivation sweeps EVERY top-level repo entry and marks it framework
# material to be stripped, EXCEPT the paths enumerated here. This closes the
# fail-open hole a hand-maintained "list the CLAIRE dirs" array left (the
# code-reviewer's verified leak: presentations, release notes, ci-templates).
#
# A path here asserts "this is genuinely NOT CLAIRE IP and MAY ship to a
# client." Adding one is a REVIEWED decision -- keep this list minimal. The
# completeness gate (claire-eject.test.sh) independently ejects the live repo
# and fails LOUD if anything OUTSIDE this set survives.
#
# Entries are top-level repo-relative paths (a file or a directory name).
# '.git' is always excluded from the export (handled in code, not listed here).
# Lines starting with '#' and blank lines are ignored.
LICENSE
.gitignore
