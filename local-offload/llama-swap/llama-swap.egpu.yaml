# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Unified Multi-GPU AI Service configuration (3 Local Setups):
#   1. 3-home-gpus   Living-Room RTX 3050 Ti (192.168.50.254:11434) embeddings + Dual-GPU RTX 5080 eGPU / RTX 5070 Ti
#                    with trained Gemma 4 26B-A4B Coder Q5_K_M-imatrix + Vision at 64K (65,536) ctx, q8_0 KV, reasoning on
#   2. laptop-gpu    Internal RTX 5070 Ti 12GB only with Gemma 4 12B + Vision (128K ctx, q4_0 KV, reasoning on, --fit-target 1200, ttl: 60)
#                    + Google EmbeddingGemma 2 BF16 GPU embeddings (protects system display / KWin / VA-API VRAM)
#   3. laptop-egpu   Dual-GPU RTX 5080 16GB eGPU + RTX 5070 Ti 12GB (inference-dual setup):
#                    Gemma 4 26B-A4B Coder Q5_K_M-imatrix (+ Vision, 64K ctx, q8_0 KV, reasoning on) & `laptop-egpu-text` (Text-only, 128K ctx, q8_0 KV);
#                    Gemma 4 31B QAT (+ MTP drafter) preserved under `31b` (Vision, 64K) and `31b-text` (Text-only, 128K)

healthCheckTimeout: 600
logLevel: info
startPort: 11440

macros:
  models: ${env.LLM_MODELS_DIR}

models:
  # ----------------------------------------------------------------------------
  # Persistent GPU Embedding Service (LAN-First to Living-Room RTX 3050 Ti 192.168.50.254:11434,
  # with automatic fallback to local Google EmbeddingGemma 2 BF16 on GPU when away; never runs on CPU)
  # ----------------------------------------------------------------------------
  embeddinggemma-2:
    aliases:
      - embedding
    env:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${env.IGPU_CUDA_DEVICE}
    cmd: |
      /home/ak/.local/bin/llama-lan-proxy --port ${PORT} --upstream http://192.168.50.254:11434 --probe-timeout 0.15 --
      llama-server-dropcache --port __FALLBACK_PORT__
      --model ${models}/embeddinggemma-2-BF16.gguf
      --embedding --pooling mean --n-gpu-layers 99 --fit off --flash-attn on
      --no-cache-prompt -sps 0
      --ctx-size 8192 --parallel 2 --batch-size 2048 --ubatch-size 2048
      --threads 4 --threads-batch 4

  # ----------------------------------------------------------------------------
  # 2. 3-home-gpus: 3050 Ti LAN Embeddings + Dual-GPU 5080 eGPU / 5070 Ti Gemma 4 26B-A4B Coder (64K ctx, Vision, q8_0 KV, reasoning on)
  # ----------------------------------------------------------------------------
  3-home-gpus:
    ttl: 0
    cmd: |
      /home/ak/.local/bin/llama-lan-proxy --port ${PORT}
      --upstream http://127.0.0.1:11434/upstream/laptop-egpu
    capabilities:
      in: [text, image]
      out: [text]

  # ----------------------------------------------------------------------------
  # 3. laptop-gpu: Internal RTX 5070 Ti 12GB ONLY — Gemma 4 12B + Vision (128K ctx, q4_0 KV, reasoning on, fit-target 1200)
  #    Fits 100% in 5070 Ti VRAM alongside EmbeddingGemma 2 BF16 and KWin/system display VRAM (ttl: 60)
  # ----------------------------------------------------------------------------
  laptop-gpu:
    ttl: 60
    env:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${env.IGPU_CUDA_DEVICE}
    cmd: |
      llama-server-dropcache --port ${PORT}
      --model ${models}/gemma4-12b.gguf
      --mmproj ${models}/gemma4-12b-mmproj.gguf
      --ctx-size 131072 --parallel 1 --flash-attn on --cache-reuse 256 --fit on --fit-target 1200
      --cache-type-k q4_0 --cache-type-v q4_0
      --batch-size 2048 --ubatch-size 1120
      --image-min-tokens 1120 --image-max-tokens 1120
      --temp 0.3 --top-k 40 --top-p 0.90 --min-p 0.05 --n-predict 12288
      --reasoning on --reasoning-budget 4096
    capabilities:
      in: [text, image]
      out: [text]

  # ----------------------------------------------------------------------------
  # 4. laptop-egpu: Dual-GPU RTX 5080 eGPU + RTX 5070 Ti — Gemma 4 26B-A4B Coder Q5_K_M-imatrix (Vision)
  #    64K (65,536) context, q8_0 KV, --fit-target 1600,1200 (reserves 5080 F16 mmproj/clip & 5070 Ti UI headroom, zero CPU spill),
  #    image tokens 280..560 with ubatch 560 (Gemma 4 non-causal image encoder requires ubatch >= image-max-tokens), reasoning on (budget 4096), ttl: 900
  # ----------------------------------------------------------------------------
  laptop-egpu:
    aliases:
      - 26b
      - gemma-coder
    ttl: 900
    env:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${env.EGPU_CUDA_DEVICE},${env.IGPU_CUDA_DEVICE}
    cmd: |
      llama-server-dropcache --port ${PORT}
      --model ${models}/gemma-4-26B-A4B-coder-Q5_K_M-imatrix.gguf
      --mmproj ${models}/gemma-4-26B-A4B-it-mmproj-F16.gguf
      --fit on --fit-target 1600,1200 --split-mode layer
      --ctx-size 65536 --parallel 1 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --batch-size 2048 --ubatch-size 560
      --image-min-tokens 280 --image-max-tokens 560
      --temp 0.3 --top-k 40 --top-p 0.90 --min-p 0.05 --n-predict 16384
      --reasoning on --reasoning-budget 4096
    capabilities:
      in: [text, image]
      out: [text]

  # 4b. laptop-egpu-text: Dual-GPU RTX 5080 eGPU + RTX 5070 Ti — Gemma 4 26B-A4B Coder Q5_K_M-imatrix Text-only (no mmproj)
  #     128K (131,072) context, q8_0 KV, --fit-target 1200,1200 (zero CPU spill + 5070 Ti UI headroom), reasoning on (budget 4096), ttl: 900
  laptop-egpu-text:
    aliases:
      - 26b-text
      - gemma-coder-text
    ttl: 900
    env:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${env.EGPU_CUDA_DEVICE},${env.IGPU_CUDA_DEVICE}
    cmd: |
      llama-server-dropcache --port ${PORT}
      --model ${models}/gemma-4-26B-A4B-coder-Q5_K_M-imatrix.gguf
      --fit on --fit-target 1200,1200 --split-mode layer
      --ctx-size 131072 --parallel 1 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --batch-size 2048 --ubatch-size 512
      --temp 0.3 --top-k 40 --top-p 0.90 --min-p 0.05 --n-predict 16384
      --reasoning on --reasoning-budget 4096
    capabilities:
      in: [text]
      out: [text]

  # ----------------------------------------------------------------------------
  # 4c. 31b & 31b-text: Preserved Gemma 4 31B QAT Full (Vision + MTP) & Text-only (+ MTP) on Dual-GPU RTX 5080 eGPU + RTX 5070 Ti
  # ----------------------------------------------------------------------------
  31b:
    ttl: 900
    env:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${env.EGPU_CUDA_DEVICE},${env.IGPU_CUDA_DEVICE}
    cmd: |
      llama-server-dropcache --port ${PORT}
      --model ${models}/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      --mmproj ${models}/gemma-4-31B-it-qat-mmproj-BF16.gguf
      --model-draft ${models}/mtp-gemma-4-31B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      --fit on --fit-target 2100,1200 --split-mode layer
      --ctx-size 65536 --parallel 1 --flash-attn on
      --cache-type-k q4_0 --cache-type-v q4_0
      --batch-size 2048 --ubatch-size 560
      --image-min-tokens 280 --image-max-tokens 560
      --temp 0.3 --top-k 40 --top-p 0.90 --min-p 0.05 --n-predict 16384
      --reasoning on --reasoning-budget 4096
    capabilities:
      in: [text, image]
      out: [text]

  31b-text:
    ttl: 900
    env:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${env.EGPU_CUDA_DEVICE},${env.IGPU_CUDA_DEVICE}
    cmd: |
      llama-server-dropcache --port ${PORT}
      --model ${models}/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      --model-draft ${models}/mtp-gemma-4-31B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      --fit on --fit-target 2100,1200 --split-mode layer
      --ctx-size 131072 --parallel 1 --flash-attn on
      --cache-type-k q4_0 --cache-type-v q4_0
      --batch-size 2048 --ubatch-size 512
      --temp 0.3 --top-k 40 --top-p 0.90 --min-p 0.05 --n-predict 16384
      --reasoning on --reasoning-budget 4096
    capabilities:
      in: [text]
      out: [text]

  # Hidden internal MCP / CADENCE compatibility pass-throughs (omitted from /v1/models & /ui)
  _mcp-inference:
    unlisted: true
    aliases:
      - inference
      - inference-dual
      - local-moe-hybrid
      - local-fast-cpu
      - local-12b-gpu
    ttl: 0
    cmd: |
      /home/ak/.local/bin/llama-lan-proxy --port ${PORT}
      --upstream http://127.0.0.1:11434/upstream/laptop-egpu

  _mcp-embed:
    unlisted: true
    aliases:
      - local-embed-cpu
    ttl: 0
    cmd: |
      /home/ak/.local/bin/llama-lan-proxy --port ${PORT}
      --upstream http://127.0.0.1:11434/upstream/embeddinggemma-2

hooks:
  on_startup:
    preload: [embeddinggemma-2]

routing:
  router:
    use: group
    settings:
      groups:
        always:
          persistent: true
          swap: false
          exclusive: false
          members: [embeddinggemma-2]
        proxies:
          persistent: true
          swap: false
          exclusive: false
          members: [3-home-gpus, _mcp-inference, _mcp-embed]
        gpu:
          swap: true
          exclusive: false
          members: [laptop-gpu, laptop-egpu, laptop-egpu-text, 31b, 31b-text]
